<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>PraxisFit — 全球金融科技监控中枢</title>
    <meta name="description" content="跨境支付情报、泰国金融监管、全球股市行情，每日自动更新">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #f5f5f7; --card: #ffffff; --text: #1a1a1a; --text-secondary: #6b7280; --text-tertiary: #9ca3af;
            --border: #e5e7eb; --accent-green: #84cc16; --accent-green-light: #ecfccb;
            --accent-blue: #3b82f6; --accent-blue-light: #dbeafe;
            --accent-orange: #f97316; --accent-orange-light: #ffedd5;
            --accent-purple: #8b5cf6; --accent-purple-light: #ede9fe;
            --radius: 20px; --radius-sm: 12px;
            --shadow: 0 2px 12px rgba(0,0,0,0.06); --shadow-lg: 0 8px 32px rgba(0,0,0,0.08);
        }
        html, body { font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased; }
        body { padding-bottom: 80px; min-height: 100vh; }
        .header { padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-green-light); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .header-title { font-size: 0.75rem; color: var(--text-secondary); }
        .header-name { font-size: 1rem; font-weight: 700; }
        .header-actions { display: flex; gap: 8px; }
        .header-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: transform 0.2s; }
        .header-btn:active { transform: scale(0.92); }
        .status-bar { margin: 0 20px 16px; padding: 14px 16px; background: var(--accent-green); border-radius: var(--radius); color: #fff; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .status-left h2 { font-size: 1rem; font-weight: 800; margin-bottom: 2px; }
        .status-left p { font-size: 0.7rem; opacity: 0.85; }
        .status-right { text-align: right; display: flex; flex-direction: column; gap: 2px; }
        .status-row { display: flex; align-items: baseline; justify-content: flex-end; gap: 6px; }
        .status-count { font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
        .status-label { font-size: 0.6rem; opacity: 0.8; }
        .status-visits { display: flex; gap: 10px; font-size: 0.7rem; opacity: 0.9; font-variant-numeric: tabular-nums; }
        .status-visits span { font-weight: 700; }
        .section { margin: 0 20px 20px; }
        .section-title { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
        .modules { display: flex; flex-direction: column; gap: 14px; }
        .module { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); text-decoration: none; color: var(--text); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; overflow: hidden; min-height: 140px; }
        .module:active { transform: scale(0.98); box-shadow: var(--shadow-lg); }
        .module-accent { height: 4px; width: 100%; flex-shrink: 0; }
        .module-payment .module-accent { background: linear-gradient(90deg, #f97316, #fb923c); }
        .module-policy .module-accent { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
        .module-stock .module-accent { background: linear-gradient(90deg, #8b5cf6, #a78bfa); }
        .module-body { flex: 1; display: flex; flex-direction: column; padding: 14px 18px 12px; }
        .module-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .module-icon { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
        .module-payment .module-icon { background: var(--accent-orange-light); }
        .module-policy .module-icon { background: var(--accent-blue-light); }
        .module-stock .module-icon { background: var(--accent-purple-light); }
        .module-title { font-size: 1rem; font-weight: 700; }
        .module-desc { font-size: 0.78rem; color: var(--text-secondary); line-height: 1.6; flex: 1; }
        .module-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
        .module-badge { font-size: 0.68rem; font-weight: 600; padding: 3px 10px; border-radius: 100px; background: var(--accent-green-light); color: #4d7c0f; }
        .module-visits { font-size: 0.65rem; color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
        .module-arrow { font-size: 1.2rem; color: var(--text-tertiary); font-weight: 300; margin-left: 8px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: var(--text-tertiary); font-size: 0.6rem; font-weight: 500; padding: 4px 12px; border-radius: 12px; transition: color 0.2s, background 0.2s; }
        .nav-item.active { color: var(--accent-green); background: var(--accent-green-light); }
        .nav-icon { font-size: 1.2rem; }
        @media (min-width: 768px) { body { max-width: 430px; margin: 0 auto; } .bottom-nav { max-width: 430px; left: 50%; transform: translateX(-50%); } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="avatar">🦉</div>
            <div><div class="header-title">监控中枢</div><div class="header-name">PraxisFit</div></div>
        </div>
        <div class="header-actions">
            <button class="header-btn" id="btn-search">🔍</button>
        </div>
    </header>
    <div class="status-bar">
        <div class="status-left"><h2>今日监控</h2><p>3 个面板 · 每日19:00更新</p></div>
        <div class="status-right">
            <div class="status-row"><span class="status-count">270+</span><span class="status-label">条目</span></div>
            <div class="status-visits">总访问 <span id="stat-total">--</span> · 今日 <span id="stat-today">--</span></div>
        </div>
    </div>
    <div class="section">
        <div class="section-title">监控面板</div>
        <div class="modules">
            <a href="/payment-intel/" class="module module-payment">
                <div class="module-accent"></div>
                <div class="module-body">
                    <div class="module-header">
                        <div class="module-icon">💳</div>
                        <div class="module-title">跨境支付情报</div>
                    </div>
                    <div class="module-desc">全球支付政策 · Crypto 监管 · 品牌战略</div>
                    <div class="module-footer">
                        <span class="module-badge">107 条</span>
                        <div style="display:flex;align-items:center;gap:4px;">
                            <span class="module-visits"><span class="visit-count" data-page="payment">--</span></span>
                            <span class="module-arrow">›</span>
                        </div>
                    </div>
                </div>
            </a>
            <a href="/policy-monitor/" class="module module-policy">
                <div class="module-accent"></div>
                <div class="module-body">
                    <div class="module-header">
                        <div class="module-icon">🛡️</div>
                        <div class="module-title">泰国政策监控</div>
                    </div>
                    <div class="module-desc">BNPL · Personal Loan · 出海监管动态</div>
                    <div class="module-footer">
                        <span class="module-badge">165 条</span>
                        <div style="display:flex;align-items:center;gap:4px;">
                            <span class="module-visits"><span class="visit-count" data-page="policy">--</span></span>
                            <span class="module-arrow">›</span>
                        </div>
                    </div>
                </div>
            </a>
            <a href="/stock-dash/" class="module module-stock">
                <div class="module-accent"></div>
                <div class="module-body">
                    <div class="module-header">
                        <div class="module-icon">📈</div>
                        <div class="module-title">股市盯盘看板</div>
                    </div>
                    <div class="module-desc">A 股·港股·美股 · 基金净值 · 宏观指标</div>
                    <div class="module-footer">
                        <span class="module-badge">三市</span>
                        <div style="display:flex;align-items:center;gap:4px;">
                            <span class="module-visits"><span class="visit-count" data-page="stock">--</span></span>
                            <span class="module-arrow">›</span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-item active"><span class="nav-icon">🏠</span><span>首页</span></a>
        <a href="/payment-intel/" class="nav-item"><span class="nav-icon">💳</span><span>支付</span></a>
        <a href="/policy-monitor/" class="nav-item"><span class="nav-icon">🛡️</span><span>政策</span></a>
        <a href="/stock-dash/" class="nav-item"><span class="nav-icon">📈</span><span>股市</span></a>
    </nav>
    <script>
        (function() {
            fetch('https://counterapi.com/api/praxisfit.me/view/portal').then(r => r.json()).then(d => { document.getElementById('stat-total').textContent = d.value || d.count || 0; }).catch(() => {});
            fetch('https://counterapi.com/api/praxisfit.me/view/portal-today').then(r => r.json()).then(d => { document.getElementById('stat-today').textContent = d.value || d.count || 0; }).catch(() => {});
            document.querySelectorAll('.visit-count').forEach(el => { const page = el.dataset.page; fetch(`https://counterapi.com/api/praxisfit.me/view/${page}`).then(r => r.json()).then(d => { el.textContent = d.value || d.count || 0; }).catch(() => { el.textContent = '--'; }); });
        })();
        (function() { const today = new Date().toISOString().slice(0, 10); if (localStorage.getItem('pv_portal_date') !== today) { fetch('https://counterapi.com/api/praxisfit.me/view/portal?trackOnly=true').catch(() => {}); localStorage.setItem('pv_portal_date', today); } })();
    </script>
</body>
</html>
